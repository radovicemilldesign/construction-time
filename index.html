<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Construction Work Log</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#171717;font-family:Inter,system-ui,sans-serif}.app{max-width:1050px;margin:auto;padding:40px 22px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.ey{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#777}h1{margin:6px 0 0;font-size:32px;letter-spacing:-.04em}.sub{color:#777;margin-top:5px}.btn{border:0;background:#171717;color:white;padding:12px 16px;border-radius:10px;font-weight:700;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.table,.month{background:white;border:1px solid #e7e7e3;border-radius:13px}.card{padding:19px}.label{font-size:11px;color:#777;text-transform:uppercase;font-weight:800;letter-spacing:.08em}.stat{font-size:27px;font-weight:800;margin-top:8px}.section{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}.section h2{font-size:17px;margin:0}.nav{display:flex;gap:6px}.icon{border:1px solid #e7e7e3;background:white;border-radius:8px;width:36px;height:36px;cursor:pointer}.row{display:grid;grid-template-columns:1.1fr .7fr 2fr .8fr;padding:15px 17px;border-bottom:1px solid #eee;align-items:center}.row:last-child{border:0}.head{font-size:10px;color:#777;text-transform:uppercase;font-weight:800;letter-spacing:.08em;background:#fafaf8}.note{color:#777;font-size:13px}.actions{text-align:right}.small{background:white;border:1px solid #e5e5e2;border-radius:7px;padding:7px 9px;cursor:pointer;margin-left:4px}.del{color:#c33}.empty{text-align:center;color:#777;padding:45px}.months{display:flex;gap:7px;flex-wrap:wrap}.month{padding:9px 12px;cursor:pointer}.active{background:#171717;color:white}.back{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center;padding:20px}.modal{background:white;border-radius:15px;padding:24px;width:min(430px,100%)}.modal h2{margin:0 0 20px}.field{margin:14px 0}.field label{display:block;font-size:11px;font-weight:800;color:#777;text-transform:uppercase;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.cancel{border:1px solid #ddd;background:white;border-radius:8px;padding:11px 14px}
@media(max-width:650px){.stats{grid-template-columns:1fr}.row{grid-template-columns:1fr .7fr}.row .note{grid-column:1/2}.row .actions{grid-column:2/3;grid-row:2}header{align-items:start;gap:10px}.app{padding:24px 14px}}
</style></head><body><div class="app">
<header><div><div class="ey">Construction</div><h1>Work Log</h1><div class="sub" id="title"></div></div><button class="btn" onclick="openAdd()">+ Add Work Day</button></header>
<div class="stats"><div class="card"><div class="label">Total Hours</div><div class="stat" id="total">0h</div></div><div class="card"><div class="label">Working Days</div><div class="stat" id="days">0</div></div><div class="card"><div class="label">Average / Day</div><div class="stat" id="avg">0h</div></div></div>
<div class="section"><h2>Work Log</h2><div class="nav"><button class="icon" onclick="move(-1)">←</button><button class="icon" onclick="move(1)">→</button></div></div>
<div class="table" id="table"></div>
<div class="section"><h2>Months</h2></div><div class="months" id="months"></div></div>
<div class="back" id="back"><div class="modal"><h2 id="mh">Add Work Day</h2><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Hours</label><input id="hours" type="number" min="0" max="24" step=".25" placeholder="e.g. 9.5"></div><div class="field"><label>Note</label><input id="note" maxlength="80" placeholder="Optional"></div><div class="modalActions"><button class="cancel" onclick="closeM()">Cancel</button><button class="btn" onclick="saveDay()">Save</button></div></div></div>
<script>
let db=JSON.parse(localStorage.getItem("cwlog")||"{}"), view=new Date();view.setDate(1),editing=null;
const mn=["January","February","March","April","May","June","July","August","September","October","November","December"],dn=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}function fmt(n){return Number.isInteger(n)?n+"h":parseFloat(n.toFixed(2))+"h"}function persist(){localStorage.setItem("cwlog",JSON.stringify(db))}
function render(){let k=key(view),a=(db[k]||[]).sort((x,y)=>x.date.localeCompare(y.date)),t=a.reduce((s,x)=>s+Number(x.hours),0);title.textContent=mn[view.getMonth()]+" "+view.getFullYear();total.textContent=fmt(t);days.textContent=a.length;avg.textContent=a.length?fmt(t/a.length):"0h";table.innerHTML='<div class="row head"><div>Date</div><div>Hours</div><div>Note</div><div></div></div>';if(!a.length)table.innerHTML+='<div class="empty">No work days recorded.</div>';a.forEach(x=>{let d=new Date(x.date+"T12:00");table.innerHTML+=`<div class="row"><div><b>${d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"})}</b><div class="note">${dn[d.getDay()]}</div></div><b>${fmt(Number(x.hours))}</b><div class="note">${esc(x.note||"")}</div><div class="actions"><button class="small" onclick="editDay('${x.id}')">Edit</button><button class="small del" onclick="delDay('${x.id}')">Delete</button></div></div>`});renderMonths()}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderMonths(){months.innerHTML="";let d=new Date();d.setDate(1);for(let i=-5;i<=6;i++){let x=new Date(d);x.setMonth(d.getMonth()+i),k=key(x);let b=document.createElement("button");b.className="month "+(k==key(view)?"active":"");b.textContent=mn[x.getMonth()].slice(0,3)+" "+x.getFullYear();b.onclick=()=>{view=x;render()};months.appendChild(b)}}
function move(n){view.setMonth(view.getMonth()+n);render()}
function openAdd(){editing=null;mh.textContent="Add Work Day";date.value=new Date().toISOString().slice(0,10);hours.value="";note.value="";back.style.display="flex";hours.focus()}
function editDay(id){editing=id;let x=(db[key(view)]||[]).find(x=>x.id===id);mh.textContent="Edit Work Day";date.value=x.date;hours.value=x.hours;note.value=x.note||"";back.style.display="flex"}
function closeM(){back.style.display="none"}
function saveDay(){let dt=date.value,h=Number(hours.value),n=note.value.trim();if(!dt||h<0||h>24||!hours.value)return alert("Unesi datum i broj sati od 0 do 24.");if(editing){for(let k of Object.keys(db)){let i=(db[k]||[]).findIndex(x=>x.id===editing);if(i>-1){db[k].splice(i,1);if(!db[k].length)delete db[k];break}}}let k=key(new Date(dt+"T12:00"));(db[k]||(db[k]=[])).push({id:Date.now().toString(),date:dt,hours:h,note:n});persist();view=new Date(dt+"T12:00");view.setDate(1);closeM();render()}
function delDay(id){if(!confirm("Delete this work day?"))return;let k=key(view);db[k]=db[k].filter(x=>x.id!==id);if(!db[k].length)delete db[k];persist();render()}
render();
</script></body></html>
